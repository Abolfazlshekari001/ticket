name: Deploy to develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy app with pm2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 -o BatchMode=yes $SERVER_USER@$SERVER_HOST 'echo "SSH connection successful - User: $(whoami), Host: $(hostname)"'

      - name: Deploy app with pm2
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PM2_NAME: ${{ secrets.PM2_NAME }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST << EOF
            set -e
            echo "Starting deployment process..."
            
            # Define variables explicitly
            SERVER_PATH="${{ secrets.SERVER_PATH }}"
            PM2_NAME="${{ secrets.PM2_NAME }}"
            
            echo "Navigating to: \$SERVER_PATH"
            cd "\$SERVER_PATH"
            echo "Current directory: \$(pwd)"
            
            # Verify it's a git repository
            if [ ! -d ".git" ]; then
              echo "Error: Not a git repository in \$(pwd)"
              ls -la
              exit 1
            fi

            echo "Fetching latest changes..."
            git fetch --all
            git reset --hard origin/develop
            git status

            echo "Installing dependencies..."
            npm ci --production
            
            echo "Building project..."
            npm run build

            echo "Loading environment variables..."
            if [ -f "development.env" ]; then
              set -a
              source development.env
              set +a
              echo "Environment variables loaded from development.env"
            else
              echo "Warning: development.env file not found in \$(pwd)"
              ls -la *.env 2>/dev/null || echo "No .env files found"
            fi

            echo "Managing PM2 application..."
            # Check if PM2 process exists
            if pm2 describe "\$PM2_NAME" > /dev/null 2>&1; then
              echo "Restarting existing PM2 process: \$PM2_NAME"
              pm2 restart "\$PM2_NAME" --update-env
            else
              echo "Starting new PM2 process: \$PM2_NAME"
              if [ -f "development.env" ]; then
                pm2 start dist/main.js --name "\$PM2_NAME" --env-file development.env
              else
                pm2 start dist/main.js --name "\$PM2_NAME"
              fi
            fi
            
            echo "Deployment completed successfully!"
            echo "PM2 Status:"
            pm2 status
          EOF