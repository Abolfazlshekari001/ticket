name: Deploy to develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy app with pm2
    needs: build  
    runs-on: ubuntu-latest
    steps:
      - name: Deploy app with pm2
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PM2_NAME: ${{ secrets.PM2_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << SSH
            set -e
            cd "$SERVER_PATH"

            git fetch --all
            git reset --hard origin/develop

            npm ci --production
            npm run build

            set -a
            source development.env
            set +a

            pm2 restart "$PM2_NAME" --update-env || pm2 start dist/main.js --name "$PM2_NAME"
          SSH
